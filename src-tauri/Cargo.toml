[package]
name = "gpsify-desktop"
version = "0.1.1"
edition = "2021"
description = "Desktop UI for gpsify built with Tauri v2"
license = "MIT"
default-run = "gpsify-desktop"

[lib]
name = "gpsify_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gpsify = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tempfile = "3"
