name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GPSIFY_DRY_RUN: "1"

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install ExifTool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Install ExifTool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test suite (macOS, including headless Chrome)
        if: runner.os == 'macOS'
        run: cargo test --locked

      - name: Run test suite (Linux, without browser E2E)
        if: runner.os == 'Linux'
        run: cargo test --locked -- --skip headless_chrome_review_workflows

      - name: Build release binary
        run: cargo build --release --locked
