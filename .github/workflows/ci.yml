name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GPSIFY_DRY_RUN: "1"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        # Exact version, not @v10: setup-uv stopped publishing moving major
        # tags after v6, so @v10 resolves to nothing and the job dies in setup.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync project and dev group
        run: uv sync --locked

      - name: Run tests with network disabled
        run: uv run pytest --disable-socket --allow-unix-socket -q
