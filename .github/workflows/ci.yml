name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GPSIFY_DRY_RUN: "1"

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        # Exact version, not @v10: setup-uv stopped publishing moving major
        # tags after v6, so @v10 resolves to nothing and the job dies in setup.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install photo dependencies
        if: runner.os == 'macOS'
        run: brew install exiftool

      - name: Sync project and dev group
        run: uv sync --locked

      - name: Install HEIC support
        if: runner.os == 'macOS'
        run: uv sync --locked --extra heic

      - name: Run fallback tests with network disabled
        if: runner.os == 'Linux'
        run: uv run pytest --disable-socket --allow-unix-socket -q

      - name: Run photo tests with network disabled
        if: runner.os == 'macOS'
        run: uv run --extra heic pytest --disable-socket --allow-unix-socket -q

      - name: Install Chromium
        if: runner.os == 'macOS'
        run: uv run playwright install chromium

      - name: Browser integration tests (loopback only)
        if: runner.os == 'macOS'
        run: uv run --extra heic pytest browser_tests -q
