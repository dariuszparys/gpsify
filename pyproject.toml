[project]
name = "gpsify"
version = "0.1.0"
description = "Visual geolocation of untagged photos. Proposes a pin; writes GPS only after a human accepts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Dariusz Parys" }]
keywords = ["geolocation", "exif", "photos", "gps"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "typer>=0.15",
  "aiosqlite>=0.20",
  "pillow>=10.0",
  "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-socket>=0.7",
]
heic = [
  "pillow-heif>=0.21",
]

[project.scripts]
gpsify = "gpsify.cli:main"

[project.urls]
Homepage = "https://github.com/dariuszparys/gpsify"
Issues = "https://github.com/dariuszparys/gpsify/issues"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-socket>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "live: hits real network APIs; not run in CI",
  "writes_exif: allows exiftool writes under tmp_path",
]
